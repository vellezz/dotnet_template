{{- $name := printf "%s-bff" (required "experience jest wymagane (ADR-0041): nazwa experience" .Values.experience) -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $name }}
  labels:
    {{- include "superapp.labels" . | nindent 4 }}
    app.kubernetes.io/name: {{ $name }}
spec:
  replicas: {{ .Values.replicas }}
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ $name }}
  template:
    metadata:
      labels:
        {{- include "superapp.labels" . | nindent 8 }}
        app.kubernetes.io/name: {{ $name }}
        superapp.example/experience-role: bff
    spec:
      terminationGracePeriodSeconds: {{ .Values.terminationGracePeriodSeconds }}
      automountServiceAccountToken: false
      securityContext:
        {{- include "app.podSecurityContext" . | nindent 8 }}
      containers:
        - name: bff
          image: "{{ include "superapp.imageRegistry" . }}/{{ $name }}:{{ include "superapp.imageTag" . }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: Authentication__Authority
              value: {{ include "superapp.authority" . | quote }}
            - name: Authentication__Audience
              value: {{ $name | quote }}
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: {{ include "superapp.otelEndpoint" . | quote }}
            {{- range $service, $address := .Values.downstream }}
            - name: Downstream__{{ $service }}__BaseAddress
              value: {{ $address | quote }}
            {{- end }}
          envFrom:
            - secretRef:
                name: {{ required "secretName jest wymagane" .Values.secretName }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          securityContext:
            {{- include "app.containerSecurityContext" . | nindent 12 }}
          {{- include "superapp.probes" . | nindent 10 }}
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $name }}
  labels:
    {{- include "superapp.labels" . | nindent 4 }}
    superapp.io/enabled: "true"
    superapp.io/component: "bff"
    superapp.io/experience: {{ .Values.experience | quote }}
  annotations:
    superapp.io/title: {{ printf "%s Experience BFF" (.Values.experience | title) | quote }}
    superapp.io/openapi-path: "/openapi/public.json"
    superapp.io/category: "BFF"
spec:
  selector:
    app.kubernetes.io/name: {{ $name }}
  ports:
    - name: http
      port: 8080
      targetPort: http
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ $name }}
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ $name }}
{{- if .Values.autoscaling.enabled }}
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: {{ $name }}
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: {{ $name }}
  minReplicas: {{ .Values.autoscaling.minReplicas }}
  maxReplicas: {{ .Values.autoscaling.maxReplicas }}
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: {{ .Values.autoscaling.targetCPUUtilizationPercentage }}
{{- end }}
