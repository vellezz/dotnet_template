{{- if .Values.enabled }}
apiVersion: batch/v1
kind: Job
metadata:
  name: superapp-migrator
  labels:
    {{- include "superapp.labels" . | nindent 4 }}
    app.kubernetes.io/name: superapp-migrator
  annotations:
    # Migracje przed rolloutem serwisów; rollout rusza dopiero po sukcesie Joba (ADR-0004).
    argocd.argoproj.io/hook: PreSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
spec:
  backoffLimit: {{ .Values.backoffLimit }}
  activeDeadlineSeconds: {{ .Values.activeDeadlineSeconds }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: superapp-migrator
    spec:
      restartPolicy: Never
      automountServiceAccountToken: false
      securityContext:
        {{- include "app.podSecurityContext" . | nindent 8 }}
      containers:
        - name: migrator
          image: "{{ .Values.image.registry }}/{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          envFrom:
            - secretRef:
                name: {{ required "secretName jest wymagane" .Values.secretName }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          securityContext:
            {{- include "app.containerSecurityContext" . | nindent 12 }}
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
{{- end }}
