server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    # Gzip compression
    gzip on;
    gzip_types application/json text/css application/javascript text/plain;


    # Generic multi-namespace & single-namespace in-cluster reverse proxy via CoreDNS (ADR-0037).
    # Supports: /proxy/{service}/{path} (default namespace)
    #           /proxy/{service}.{namespace}/{path} (multi-namespace K8s discovery)
    location ~ ^/proxy/([a-zA-Z0-9_\-]+)(?:\.([a-zA-Z0-9_\-]+))?(?:/(.*))?$ {
        resolver 10.96.0.10 valid=10s ipv6=off;
        set $upstream_svc $1;
        set $upstream_ns $2;
        set $upstream_uri $3;
        if ($upstream_ns = '') {
            set $upstream_ns 'default';
        }
        proxy_pass http://$upstream_svc.$upstream_ns.svc.cluster.local:8080/$upstream_uri$is_args$args;
        proxy_http_version 1.1;
        proxy_set_header Host $upstream_svc;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_pass_request_headers on;
        proxy_connect_timeout 10s;
        proxy_read_timeout 60s;
    }

    # Dynamic K8s Service Discovery endpoint
    location /api/ {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Access-Control-Allow-Origin "*";
    }

    # Health endpoint
    location /healthz {
        access_log off;
        return 200 "OK\n";
    }

    location / {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        try_files $uri $uri/ /index.html;
    }
}
